<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <!-- 3D Stop Octagon -->
  <polygon points="16,6 32,6 43,17 43,33 32,44 16,44 5,33 5,17" fill="#7F1D1D"/>
  <polygon points="16,5 32,5 43,16 43,32 32,43 16,43 5,32 5,16" fill="url(#stopGrad)" stroke="#991B1B" stroke-width="1.5"/>
  <ellipse cx="24" cy="13" rx="12" ry="5" fill="white" opacity="0.3"/>
  <!-- White Stop Square -->
  <rect x="15" y="16" width="18" height="18" rx="2" fill="#450A0A" transform="translate(0, 1)"/>
  <rect x="15" y="15" width="18" height="18" rx="2" fill="white"/>
  <rect x="16" y="16" width="16" height="8" rx="1" fill="#FEE2E2" opacity="0.5"/>
</svg>
